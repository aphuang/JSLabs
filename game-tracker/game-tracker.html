<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP's 遊戲進度追蹤系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK TC', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            transition: background-color 0.3s;
        }

        body.light-mode {
            background: #f5f5f5;
            color: #1a1a1a;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        body.light-mode header {
            border-bottom-color: #ddd;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button.secondary {
            background: #64748b;
        }

        button.secondary:hover {
            background: #475569;
        }

        button.danger {
            background: #dc2626;
        }

        button.danger:hover {
            background: #b91c1c;
        }

        .toggle-btn {
            width: 50px;
            height: 30px;
            background: #64748b;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-btn.active {
            background: #2563eb;
        }

        .toggle-btn::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: left 0.3s;
        }

        .toggle-btn.active::after {
            left: 23px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }

        body.light-mode .tabs {
            border-bottom-color: #ddd;
        }

        .tab-btn {
            background: none;
            color: #888;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }

        body.light-mode .tab-btn {
            color: #999;
        }

        body.light-mode .tab-btn.active {
            color: #2563eb;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .table-container {
            overflow-x: auto;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
        }

        body.light-mode .table-container {
            background: white;
            border-color: #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #2a2a2a;
            padding: 14px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #333;
            color: #e0e0e0;
        }

        body.light-mode th {
            background: #f0f0f0;
            border-bottom-color: #ddd;
            color: #1a1a1a;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid #2a2a2a;
        }

        body.light-mode td {
            border-bottom-color: #e0e0e0;
        }

        tr:hover {
            background: #242424;
        }

        body.light-mode tr:hover {
            background: #f9f9f9;
        }

        input, select {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        body.light-mode input,
        body.light-mode select {
            background: #f5f5f5;
            color: #1a1a1a;
            border-color: #ddd;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #444;
            border-radius: 3px;
            overflow: hidden;
        }

        body.light-mode .progress-bar {
            background: #ddd;
        }

        .progress-fill {
            height: 100%;
            background: #2563eb;
            transition: width 0.3s;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.not-started {
            background: #4b5563;
            color: #e0e0e0;
        }

        .status-badge.in-progress {
            background: #b8860b;
            color: white;
        }

        .status-badge.completed {
            background: #059669;
            color: white;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #2563eb;
        }

        .add-row-btn {
            margin-top: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }

        body.light-mode .stat-card {
            background: white;
            border-color: #ddd;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #2563eb;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        body.light-mode .modal-content {
            background: white;
            border-color: #ddd;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #aaa;
        }

        body.light-mode .form-group label {
            color: #666;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
        }

        .error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
        }

        .success {
            color: #10b981;
            font-size: 12px;
            margin-top: 4px;
        }

        .action-cell {
            display: flex;
            gap: 8px;
        }

        .action-cell button {
            padding: 6px 12px;
            font-size: 12px;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .summary {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        body.light-mode .summary {
            background: white;
            border-color: #ddd;
        }

        @media (max-width: 768px) {
            .header-controls {
                flex-wrap: wrap;
                gap: 8px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px 8px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🎮 遊戲進度追蹤系統</h1>
        <div class="header-controls">
            <button class="secondary" onclick="exportData()">📥 導出</button>
            <button class="secondary" onclick="showImportModal()">📤 匯入</button>
            <button class="secondary" onclick="resetData()">🔄 重置</button>
            <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()"></button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('games')">🎮 遊戲</button>
        <button class="tab-btn" onclick="switchTab('milestones')">🏁 里程碑</button>
        <button class="tab-btn" onclick="switchTab('schedule')">📅 週計劃</button>
    </div>

    <!-- Games Tab -->
    <div id="games" class="tab-content active">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">總遊戲數</div>
                <div class="stat-value" id="totalGames">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">已完成</div>
                <div class="stat-value" id="completedGames">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">平均進度</div>
                <div class="stat-value" id="avgProgress">0%</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>遊戲名稱</th>
                        <th>優先級</th>
                        <th style="width: 200px;">進度</th>
                        <th>里程碑</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="gamesTable">
                </tbody>
            </table>
        </div>
        <button class="add-row-btn" onclick="addGame()">+ 新增遊戲</button>
    </div>

    <!-- Milestones Tab -->
    <div id="milestones" class="tab-content">
        <div class="summary">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px;">
                <div>
                    <div class="stat-label">總里程碑數</div>
                    <div class="stat-value" id="totalMilestones">0</div>
                </div>
                <div>
                    <div class="stat-label">已完成</div>
                    <div class="stat-value" id="completedMilestones">0</div>
                </div>
                <div>
                    <div class="stat-label">進行中</div>
                    <div class="stat-value" id="inProgressMilestones">0</div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>里程碑名稱</th>
                        <th>遊戲</th>
                        <th>狀態</th>
                        <th>預期週數</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="milestonesTable">
                </tbody>
            </table>
        </div>
        <button class="add-row-btn" onclick="addMilestone()">+ 新增里程碑</button>
    </div>

    <!-- Schedule Tab -->
    <div id="schedule" class="tab-content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">本週時間槽</div>
                <div class="stat-value" id="totalSlots">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">已完成</div>
                <div class="stat-value" id="completedSlots">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">完成度</div>
                <div class="stat-value" id="scheduleProgress">0%</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>時段</th>
                        <th>預計遊戲</th>
                        <th>時長</th>
                        <th style="width: 100px;">完成</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="scheduleTable">
                </tbody>
            </table>
        </div>
        <button class="add-row-btn" onclick="addSchedule()">+ 新增時段</button>
    </div>
</div>

<!-- Import Modal -->
<div id="importModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">匯入資料</div>
        <div class="form-group">
            <label>將 JSON 資料貼到下方：</label>
            <textarea id="importData" placeholder="貼上 JSON 內容..."></textarea>
        </div>
        <div id="importError" class="error"></div>
        <div class="modal-actions">
            <button onclick="importData()">確認匯入</button>
            <button class="secondary" onclick="closeImportModal()">取消</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'game-tracker-data';

    let data = {
        games: [],
        milestones: [],
        schedule: []
    };

    // 初始化遊戲數據
    const defaultGames = [
        { id: 1, name: 'Kingdom Come: Deliverance 2', priority: 'High' },
        { id: 2, name: 'Grim Dawn', priority: 'Medium' },
        { id: 3, name: 'Metro Exodus', priority: 'Medium' },
        { id: 4, name: 'Dead Cells', priority: 'Medium' },
        { id: 5, name: 'Street Fighter 6', priority: 'High' },
        { id: 6, name: 'Euro Truck Simulator 2', priority: 'Low' },
        { id: 7, name: 'Gran Turismo 7', priority: 'Low' },
        { id: 8, name: '桃太郎電鐵中文版', priority: 'Low' },
        { id: 9, name: '惡魔靈魂重製版', priority: 'High' }
    ];

    const defaultMilestones = [
        { id: 1, name: '序章完成', gameId: 1, status: 'Not Started', expectedWeek: '1-2' },
        { id: 2, name: '諾瓦克城堡', gameId: 1, status: 'Not Started', expectedWeek: '2-3' },
        { id: 3, name: '首次解鎖', gameId: 4, status: 'Not Started', expectedWeek: '1-2' },
        { id: 4, name: 'Act I 通關', gameId: 2, status: 'Not Started', expectedWeek: '2-3' },
        { id: 5, name: 'Aurora 起程', gameId: 3, status: 'Not Started', expectedWeek: '1' }
    ];

    const defaultSchedule = [
        { id: 1, timeSlot: '週一晚間', games: 'ETS2 + SF6', duration: '2hr', completed: false },
        { id: 2, timeSlot: '週二晚間', games: 'Dead Cells', duration: '2hr', completed: false },
        { id: 3, timeSlot: '週三晚間', games: 'GT7 + SF6', duration: '2hr', completed: false },
        { id: 4, timeSlot: '週四晚間', games: 'Dead Cells', duration: '2hr', completed: false },
        { id: 5, timeSlot: '週五晚間', games: 'ETS2 + SF6', duration: '2hr', completed: false },
        { id: 6, timeSlot: '週六下午', games: 'KCD2/Grim Dawn', duration: '3-4hr', completed: false },
        { id: 7, timeSlot: '週六晚間', games: '桃太郎電鐵', duration: '2hr', completed: false },
        { id: 8, timeSlot: '週日下午', games: '惡魔靈魂', duration: '3-4hr', completed: false },
        { id: 9, timeSlot: '週日晚間', games: 'Metro Exodus/自由選擇', duration: '2hr', completed: false }
    ];

    function init() {
        loadData();
        setupTheme();
        renderAll();
    }

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                data = JSON.parse(saved);
            } catch (e) {
                console.error('Failed to load data:', e);
                initializeDefault();
            }
        } else {
            initializeDefault();
        }
    }

    function initializeDefault() {
        data = {
            games: defaultGames.map((g, i) => ({ ...g, id: i + 1 })),
            milestones: defaultMilestones.map((m, i) => ({ ...m, id: i + 1 })),
            schedule: defaultSchedule.map((s, i) => ({ ...s, id: i + 1 }))
        };
        saveData();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function setupTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeToggle').classList.add('active');
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        document.getElementById('themeToggle').classList.toggle('active');
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        event.target.classList.add('active');
    }

    function renderAll() {
        renderGames();
        renderMilestones();
        renderSchedule();
    }

    function renderGames() {
        const tbody = document.getElementById('gamesTable');
        tbody.innerHTML = '';

        data.games.forEach(game => {
            const milestones = data.milestones.filter(m => m.gameId === game.id);
            const completed = milestones.filter(m => m.status === 'Completed').length;
            const progress = milestones.length > 0 ? Math.round((completed / milestones.length) * 100) : 0;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${game.name}</td>
                <td>${game.priority}</td>
                <td>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div style="font-size: 12px; color: #888; margin-top: 4px;">${progress}%</div>
                </td>
                <td>${milestones.length}</td>
                <td>
                    <div class="action-cell">
                        <button class="secondary" style="padding: 4px 8px; font-size: 11px;" onclick="editGame(${game.id})">編輯</button>
                        <button class="delete-btn" style="padding: 4px 8px; font-size: 11px;" onclick="deleteGame(${game.id})">刪除</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });

        // 更新統計
        const completed = data.games.length > 0 ? data.games.filter(g => {
            const ms = data.milestones.filter(m => m.gameId === g.id);
            return ms.length > 0 && ms.every(m => m.status === 'Completed');
        }).length : 0;
        const avgProgress = data.games.length > 0 ? Math.round(
            data.games.reduce((acc, game) => {
                const ms = data.milestones.filter(m => m.gameId === game.id);
                if (ms.length === 0) return acc;
                return acc + (ms.filter(m => m.status === 'Completed').length / ms.length);
            }, 0) / data.games.length * 100
        ) : 0;

        document.getElementById('totalGames').textContent = data.games.length;
        document.getElementById('completedGames').textContent = completed;
        document.getElementById('avgProgress').textContent = avgProgress + '%';
    }

    function renderMilestones() {
        const tbody = document.getElementById('milestonesTable');
        tbody.innerHTML = '';

        data.milestones.forEach(milestone => {
            const game = data.games.find(g => g.id === milestone.gameId);
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${milestone.name}</td>
                <td>${game ? game.name : '未指定'}</td>
                <td>
                    <select onchange="updateMilestone(${milestone.id}, 'status', this.value)" style="width: 100px;">
                        <option value="Not Started" ${milestone.status === 'Not Started' ? 'selected' : ''}>未開始</option>
                        <option value="In Progress" ${milestone.status === 'In Progress' ? 'selected' : ''}>進行中</option>
                        <option value="Completed" ${milestone.status === 'Completed' ? 'selected' : ''}>已完成</option>
                    </select>
                </td>
                <td>${milestone.expectedWeek}</td>
                <td>
                    <div class="action-cell">
                        <button class="secondary" style="padding: 4px 8px; font-size: 11px;" onclick="editMilestone(${milestone.id})">編輯</button>
                        <button class="delete-btn" style="padding: 4px 8px; font-size: 11px;" onclick="deleteMilestone(${milestone.id})">刪除</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });

        const completed = data.milestones.filter(m => m.status === 'Completed').length;
        const inProgress = data.milestones.filter(m => m.status === 'In Progress').length;
        document.getElementById('totalMilestones').textContent = data.milestones.length;
        document.getElementById('completedMilestones').textContent = completed;
        document.getElementById('inProgressMilestones').textContent = inProgress;
    }

    function renderSchedule() {
        const tbody = document.getElementById('scheduleTable');
        tbody.innerHTML = '';

        data.schedule.forEach(slot => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${slot.timeSlot}</td>
                <td>${slot.games}</td>
                <td>${slot.duration}</td>
                <td style="text-align: center;">
                    <input type="checkbox" class="checkbox" ${slot.completed ? 'checked' : ''} onchange="updateSchedule(${slot.id}, 'completed', this.checked)">
                </td>
                <td>
                    <div class="action-cell">
                        <button class="secondary" style="padding: 4px 8px; font-size: 11px;" onclick="editSchedule(${slot.id})">編輯</button>
                        <button class="delete-btn" style="padding: 4px 8px; font-size: 11px;" onclick="deleteSchedule(${slot.id})">刪除</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });

        const completed = data.schedule.filter(s => s.completed).length;
        const progress = data.schedule.length > 0 ? Math.round((completed / data.schedule.length) * 100) : 0;
        document.getElementById('totalSlots').textContent = data.schedule.length;
        document.getElementById('completedSlots').textContent = completed;
        document.getElementById('scheduleProgress').textContent = progress + '%';
    }

    function addGame() {
        const name = prompt('遊戲名稱:');
        if (name) {
            data.games.push({
                id: Date.now(),
                name: name,
                priority: 'Medium'
            });
            saveData();
            renderGames();
        }
    }

    function editGame(id) {
        const game = data.games.find(g => g.id === id);
        if (game) {
            const newName = prompt('編輯遊戲名稱:', game.name);
            if (newName) {
                game.name = newName;
                saveData();
                renderGames();
            }
        }
    }

    function deleteGame(id) {
        if (confirm('確定刪除此遊戲及其所有里程碑？')) {
            data.games = data.games.filter(g => g.id !== id);
            data.milestones = data.milestones.filter(m => m.gameId !== id);
            saveData();
            renderAll();
        }
    }

    function addMilestone() {
        const name = prompt('里程碑名稱:');
        if (name && data.games.length > 0) {
            const gameId = parseInt(prompt(`選擇遊戲 ID (1-${data.games.length}):`) || 1);
            data.milestones.push({
                id: Date.now(),
                name: name,
                gameId: gameId,
                status: 'Not Started',
                expectedWeek: '1'
            });
            saveData();
            renderAll();
        }
    }

    function editMilestone(id) {
        const milestone = data.milestones.find(m => m.id === id);
        if (milestone) {
            const newName = prompt('編輯里程碑名稱:', milestone.name);
            if (newName) {
                milestone.name = newName;
                saveData();
                renderMilestones();
            }
        }
    }

    function updateMilestone(id, field, value) {
        const milestone = data.milestones.find(m => m.id === id);
        if (milestone) {
            milestone[field] = value;
            saveData();
            renderAll();
        }
    }

    function deleteMilestone(id) {
        if (confirm('確定刪除此里程碑？')) {
            data.milestones = data.milestones.filter(m => m.id !== id);
            saveData();
            renderAll();
        }
    }

    function addSchedule() {
        const timeSlot = prompt('時段 (如: 週一晚間):');
        if (timeSlot) {
            data.schedule.push({
                id: Date.now(),
                timeSlot: timeSlot,
                games: '待指定',
                duration: '2hr',
                completed: false
            });
            saveData();
            renderSchedule();
        }
    }

    function editSchedule(id) {
        const slot = data.schedule.find(s => s.id === id);
        if (slot) {
            const newGames = prompt('編輯預計遊戲:', slot.games);
            if (newGames) {
                slot.games = newGames;
                saveData();
                renderSchedule();
            }
        }
    }

    function updateSchedule(id, field, value) {
        const slot = data.schedule.find(s => s.id === id);
        if (slot) {
            slot[field] = value;
            saveData();
            renderAll();
        }
    }

    function deleteSchedule(id) {
        if (confirm('確定刪除此時段？')) {
            data.schedule = data.schedule.filter(s => s.id !== id);
            saveData();
            renderSchedule();
        }
    }

    function exportData() {
        const jsonString = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `game-tracker-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    }

    function showImportModal() {
        document.getElementById('importModal').classList.add('active');
    }

    function closeImportModal() {
        document.getElementById('importModal').classList.remove('active');
        document.getElementById('importData').value = '';
        document.getElementById('importError').textContent = '';
    }

    function importData() {
        try {
            const json = document.getElementById('importData').value;
            const imported = JSON.parse(json);
            if (imported.games && imported.milestones && imported.schedule) {
                data = imported;
                saveData();
                renderAll();
                closeImportModal();
                alert('匯入成功！');
            } else {
                document.getElementById('importError').textContent = '資料格式不正確，缺少必要字段。';
            }
        } catch (e) {
            document.getElementById('importError').textContent = '解析 JSON 失敗: ' + e.message;
        }
    }

    function resetData() {
        if (confirm('確定要重置所有資料到默認狀態？此操作不可撤銷。')) {
            initializeDefault();
            renderAll();
            alert('資料已重置！');
        }
    }

    // 初始化
    init();
</script>
</body>
</html>
